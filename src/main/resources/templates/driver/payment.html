<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Simulated Payment Gateway')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow border-0 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="stat-icon purple mx-auto mb-3">
                        <i class="bi bi-shield-check fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Simulated Payment Gateway</h3>
                    <p class="text-muted small">Secure Sandbox Checkout for SmartPark</p>
                </div>

                <!-- Booking Order Summary -->
                <div class="card bg-light border-0 p-3 mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted small">Booking Reference:</span>
                        <strong class="font-monospace text-primary" th:text="${booking.bookingCode}">SP-12345678</strong>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted small">Slot &amp; Zone:</span>
                        <span class="fw-semibold" th:text="${booking.slot.slotNumber + ' (' + booking.slot.zone.name + ')'}">A-01</span>
                    </div>
                    <hr class="my-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Payable Amount:</span>
                        <span class="fs-4 fw-extrabold text-success" th:text="'$' + ${booking.amount}">$25.00</span>
                    </div>
                </div>

                <form th:action="@{/driver/bookings/{id}/pay(id=${booking.id})}" method="post" th:object="${paymentRequest}">
                    <input type="hidden" th:field="*{bookingId}">
                    <input type="hidden" th:field="*{mode}" value="ONLINE">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Card Number (Simulated)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
                            <input type="text" class="form-control font-monospace" th:field="*{cardNumber}" placeholder="4532 •••• •••• 8899" required value="4532 8812 3456 8899">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-semibold">Expiry (MM/YY)</label>
                            <input type="text" class="form-control" th:field="*{cardExpiry}" placeholder="12/28" required value="12/28">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold">CVV</label>
                            <input type="text" class="form-control" th:field="*{cardCvv}" placeholder="123" required value="123">
                        </div>
                    </div>

                    <!-- Simulation Toggle -->
                    <div class="form-check form-switch p-3 bg-light rounded border mb-4">
                        <input class="form-check-input ms-0 me-2" type="checkbox" role="switch" id="simFail" th:field="*{simulateFailure}">
                        <label class="form-check-label small fw-semibold" for="simFail">
                            Simulate Payment Failure (Sandbox test)
                        </label>
                        <div class="small text-muted ps-4">Toggle on to test decline &amp; retry flow</div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-accent py-2 fw-semibold">
                            <i class="bi bi-lock-fill me-1"></i> Pay Now (<span th:text="'$' + ${booking.amount}">$25.00</span>)
                        </button>
                        <a th:href="@{/driver/bookings/{id}(id=${booking.id})}" class="btn btn-outline-secondary py-2">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
