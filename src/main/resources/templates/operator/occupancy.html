<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Live Zone Occupancy Grid')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container-fluid px-lg-4 py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Live Occupancy Grid</h2>
            <p class="text-muted small mb-0">Real-time visual floor plan and slot status monitor</p>
        </div>
        <!-- Legend -->
        <div class="d-flex flex-wrap gap-2 mt-2 mt-md-0">
            <span class="badge slot-badge-available px-3 py-2"><i class="bi bi-circle-fill me-1"></i> Available</span>
            <span class="badge slot-badge-reserved px-3 py-2"><i class="bi bi-circle-fill me-1"></i> Reserved</span>
            <span class="badge slot-badge-occupied px-3 py-2"><i class="bi bi-circle-fill me-1"></i> Occupied</span>
            <span class="badge slot-badge-maintenance px-3 py-2"><i class="bi bi-circle-fill me-1"></i> Maintenance</span>
        </div>
    </div>

    <!-- Zone Selector Tabs -->
    <ul class="nav nav-pills mb-4 gap-2">
        <li class="nav-item" th:each="z : ${zones}">
            <a class="nav-link px-4 py-2 fw-semibold"
               th:classappend="${selectedZoneId == z.id ? 'active bg-primary' : 'bg-white text-dark border'}"
               th:href="@{/operator/occupancy(zoneId=${z.id})}"
               th:text="${z.name}">
                Zone A
            </a>
        </li>
    </ul>

    <!-- Visual Grid Card -->
    <div class="card shadow-sm border-0 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h4 class="fw-bold mb-0 text-primary">Floor Layout</h4>
                <small class="text-muted">Total Bays in this Zone: <strong th:text="${#lists.size(slots)}">20</strong></small>
            </div>
            <a th:href="@{/operator/slots(zoneId=${selectedZoneId})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-gear me-1"></i> Edit Slot Config
            </a>
        </div>

        <div th:if="${#lists.isEmpty(slots)}" class="text-center py-5 text-muted">
            <i class="bi bi-grid fs-1 d-block mb-2"></i>
            No slots created in this zone yet.
        </div>

        <!-- Dynamic Grid of Slots -->
        <div th:unless="${#lists.isEmpty(slots)}" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3">
            <div class="col" th:each="slot : ${slots}">
                <div class="slot-box" th:classappend="${slot.status.name()}">
                    <div class="d-flex justify-content-between align-items-center small mb-1">
                        <span class="badge bg-light text-dark border py-0 px-1" style="font-size: 0.65rem;" th:text="${slot.vehicleType}">CAR</span>
                        <i th:if="${slot.status.name() == 'AVAILABLE'}" class="bi bi-check-circle-fill text-success"></i>
                        <i th:if="${slot.status.name() == 'RESERVED'}" class="bi bi-clock-fill text-warning"></i>
                        <i th:if="${slot.status.name() == 'OCCUPIED'}" class="bi bi-car-front-fill text-danger"></i>
                        <i th:if="${slot.status.name() == 'MAINTENANCE'}" class="bi bi-tools text-secondary"></i>
                    </div>

                    <div class="h4 fw-extrabold mb-1 font-monospace" th:text="${slot.slotNumber}">A-01</div>

                    <span class="badge w-100"
                          th:classappend="${slot.status.name() == 'AVAILABLE' ? 'bg-success' : (slot.status.name() == 'RESERVED' ? 'bg-warning text-dark' : (slot.status.name() == 'OCCUPIED' ? 'bg-danger' : 'bg-secondary'))}"
                          th:text="${slot.status.name()}" style="font-size: 0.7rem;">
                        AVAILABLE
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
