<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('System Error (500)')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-5 py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-danger">
                <div class="mb-4 text-danger">
                    <i class="bi bi-exclamation-octagon-fill fs-1 display-1"></i>
                </div>
                <h1 class="h2 fw-bold text-dark mb-3">500 - Server Error</h1>
                <p class="text-muted mb-4" th:text="${message != null ? message : 'An unexpected error occurred during processing.'}">
                    An internal error occurred.
                </p>
                <div>
                    <a th:href="@{/}" class="btn btn-primary px-4"><i class="bi bi-arrow-left me-2"></i>Return to Safety</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
