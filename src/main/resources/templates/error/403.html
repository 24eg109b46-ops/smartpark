<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Access Denied (403)')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-5 py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 border-danger shadow-sm">
                <div class="mb-4 text-danger">
                    <i class="bi bi-shield-x fs-1 display-1"></i>
                </div>
                <h1 class="h2 fw-bold text-danger mb-3">403 - Access Denied</h1>
                <p class="text-muted mb-4" th:text="${message != null ? message : 'You do not have the required permissions to view this resource.'}">
                    You do not have the required permissions to view this resource.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-primary px-4"><i class="bi bi-house-door me-2"></i>Return Home</a>
                    <a th:href="@{/login}" class="btn btn-outline-secondary px-4"><i class="bi bi-box-arrow-in-right me-2"></i>Switch Account</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
