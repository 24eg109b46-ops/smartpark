<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Page Not Found (404)')}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container my-5 py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-5 shadow-sm border-warning">
                <div class="mb-4 text-warning">
                    <i class="bi bi-geo-alt-fill fs-1 display-1"></i>
                </div>
                <h1 class="h2 fw-bold text-dark mb-3">404 - Page Not Found</h1>
                <p class="text-muted mb-4" th:text="${message != null ? message : 'The parking bay, page, or record you requested could not be found.'}">
                    The requested page could not be found.
                </p>
                <div>
                    <a th:href="@{/}" class="btn btn-primary px-4"><i class="bi bi-house-door me-2"></i>Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
