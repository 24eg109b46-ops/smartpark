<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Driver Registration')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow border-0 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="stat-icon green mx-auto mb-3">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Create Driver Account</h3>
                    <p class="text-muted small">Register to instantly reserve slots and manage vehicles</p>
                </div>

                <form th:action="@{/register}" method="post" th:object="${registerRequest}">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" th:field="*{name}" id="name" placeholder="John Doe" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address *</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="john@example.com" required>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control" th:field="*{phone}" id="phone" placeholder="+1-555-0199">
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Password *</label>
                            <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="Min 6 characters" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword" placeholder="Repeat password" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold mb-3">
                        <i class="bi bi-check-circle-fill me-2"></i>Complete Registration
                    </button>

                    <div class="text-center small text-muted">
                        Already have an account? <a th:href="@{/login}" class="text-decoration-none fw-semibold">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
