<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="mt-auto">
    <div class="container py-4">
        <div class="row g-4 align-items-center">
            <div class="col-md-6 text-center text-md-start">
                <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-2 mb-2">
                    <i class="bi bi-p-square-fill text-warning fs-4"></i>
                    <span class="fs-5 fw-bold text-white">SmartPark</span>
                </div>
                <p class="mb-1 text-light fw-medium">Park Smarter | Save Time | Move Better</p>
                <small class="text-secondary">Centralized Smart Parking Management Platform for Drivers, Operators & Admins.</small>
            </div>
            <div class="col-md-6 text-center text-md-end">
                <div class="mb-2">
                    <a th:href="@{/}" class="text-decoration-none me-3">Home</a>
                    <a th:href="@{/pricing}" class="text-decoration-none me-3">Pricing Rates</a>
                    <a th:href="@{/about}" class="text-decoration-none me-3">About System</a>
                    <a th:href="@{/login}" class="text-decoration-none">Portal Login</a>
                </div>
                <div class="small text-secondary">
                    &copy; <span th:text="${#calendars.format(#calendars.createNow(), 'yyyy')}">2026</span> SmartPark. All rights reserved. Built with Spring Boot 3 &amp; Bootstrap 5.
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
