# Production Profile with MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartpark?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:smartpark}
spring.datasource.password=${DB_PASS:smartpark123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf caching enabled in prod
spring.thymeleaf.cache=true
