<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Notifications')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Notifications &amp; Alerts</h2>
            <p class="text-muted small mb-0">System updates regarding your parking reservations and gate activity</p>
        </div>
        <form th:action="@{/driver/notifications/mark-all-read}" method="post">
            <button type="submit" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-check2-all me-1"></i> Mark All as Read
            </button>
        </form>
    </div>

    <!-- Notification Cards -->
    <div class="card shadow-sm border-0">
        <div class="list-group list-group-flush">
            <div th:if="${notificationsPage.totalElements == 0}" class="text-center py-5 text-muted">
                <i class="bi bi-bell-slash fs-1 d-block mb-2 text-secondary"></i>
                You have no notifications at this time.
            </div>

            <div th:each="n : ${notificationsPage.content}"
                 class="list-group-item p-4 d-flex justify-content-between align-items-start"
                 th:classappend="${!n.read ? 'bg-light border-start border-4 border-primary' : ''}">
                <div class="d-flex gap-3">
                    <div class="stat-icon"
                         th:classappend="${n.type.name() == 'SUCCESS' ? 'green' : (n.type.name() == 'WARNING' ? 'amber' : (n.type.name() == 'DANGER' ? 'red' : 'blue'))}">
                        <i class="bi"
                           th:classappend="${n.type.name() == 'SUCCESS' ? 'bi-check-circle-fill' : (n.type.name() == 'WARNING' ? 'bi-exclamation-triangle-fill' : (n.type.name() == 'DANGER' ? 'bi-x-octagon-fill' : 'bi-info-circle-fill'))}">
                        </i>
                    </div>
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <h6 class="fw-bold mb-0" th:text="${n.title}">Notification Title</h6>
                            <span class="badge bg-primary" th:if="${!n.read}">NEW</span>
                        </div>
                        <p class="text-muted small mb-1" th:text="${n.message}">Notification message detail...</p>
                        <small class="text-secondary" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">Date</small>
                    </div>
                </div>

                <div th:if="${!n.read}">
                    <form th:action="@{/driver/notifications/mark-read/{id}(id=${n.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-light border text-muted" title="Mark as read">
                            <i class="bi bi-check2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
