<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Parking Zones Management')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Parking Zones &amp; Locations</h2>
            <p class="text-muted small mb-0">Configure facilities, terminal areas, levels, and bay capacity</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createZoneModal">
            <i class="bi bi-plus-lg me-1"></i> Add Parking Zone
        </button>
    </div>

    <!-- Zones Table -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Zone Name</th>
                    <th>Location / Gate</th>
                    <th>Floor / Deck</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(zones)}">
                    <td colspan="6" class="text-center py-4 text-muted">No parking zones defined yet.</td>
                </tr>
                <tr th:each="z : ${zones}">
                    <td class="fw-bold text-primary" th:text="${z.name}">Zone A</td>
                    <td th:text="${z.location}">Terminal 1</td>
                    <td>
                        <span class="badge bg-light text-dark border" th:text="${z.floor != null ? z.floor : 'N/A'}">Floor 0</span>
                    </td>
                    <td class="fw-semibold" th:text="${z.capacity} + ' Slots'">20 Slots</td>
                    <td>
                        <span class="badge bg-success" th:if="${z.status.name() == 'ACTIVE'}">ACTIVE</span>
                        <span class="badge bg-secondary" th:unless="${z.status.name() == 'ACTIVE'}">INACTIVE</span>
                    </td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-secondary me-1" data-bs-toggle="modal" th:data-bs-target="'#editZoneModal-' + ${z.id}">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <form th:action="@{/operator/zones/delete/{id}(id=${z.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this parking zone? All associated slots must be cleared first.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Zone Modal -->
<div class="modal fade" id="createZoneModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/operator/zones}" method="post" th:object="${zoneDto}">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Create Parking Zone</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Zone Name *</label>
                        <input type="text" class="form-control" th:field="*{name}" required placeholder="e.g. Zone D - South Gate">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Location / Address *</label>
                        <input type="text" class="form-control" th:field="*{location}" required placeholder="e.g. Terminal 2 Arrival">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold">Floor / Level</label>
                            <input type="text" class="form-control" th:field="*{floor}" placeholder="e.g. Level 1">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Capacity (Slots) *</label>
                            <input type="number" class="form-control" th:field="*{capacity}" min="1" required value="20">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Status</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Zone</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Zone Modals -->
<div th:each="z : ${zones}" class="modal fade" th:id="'editZoneModal-' + ${z.id}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/operator/zones/edit/{id}(id=${z.id})}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Edit Parking Zone</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Zone Name *</label>
                        <input type="text" class="form-control" name="name" th:value="${z.name}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Location / Address *</label>
                        <input type="text" class="form-control" name="location" th:value="${z.location}" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold">Floor / Level</label>
                            <input type="text" class="form-control" name="floor" th:value="${z.floor}">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold">Capacity (Slots) *</label>
                            <input type="number" class="form-control" name="capacity" th:value="${z.capacity}" min="1" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Status</label>
                        <select class="form-select" name="status">
                            <option value="ACTIVE" th:selected="${z.status.name() == 'ACTIVE'}">ACTIVE</option>
                            <option value="INACTIVE" th:selected="${z.status.name() == 'INACTIVE'}">INACTIVE</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
